<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinstkalkyl</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vinstkalkyl">
<meta name="theme-color" content="#1b1b1b">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Layout: one column. Small top bar, big two-tone headline with the totals, then two plain tables. Dark only. */
:root {
  --bg: #1b1b1b;
  --fg: #f2f2f2;
  --muted: #8c8c8c;
  --line: #2e2e2e;
  --chip: #262626;
  --chip-hover: #303030;
  --accent: #2450ff;
  --pos: #9fd8a8;
  --neg: #f08d8d;
  --sans: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font: 500 15px/1.45 var(--sans); letter-spacing: -0.01em;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  margin: 0;
}
html { background: var(--bg); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
main { max-width: 860px; margin: 0 auto; }

header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 72px; }
.logo { font-size: 22px; font-weight: 600; letter-spacing: -0.035em; }
.status { color: var(--muted); font-size: 13px; background: var(--chip); border-radius: 4px; padding: 5px 10px; }

.hero { margin-bottom: 72px; }
.h1 { font-size: clamp(26px, 4.6vw, 36px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.12; margin: 0; text-wrap: balance; font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
.sub { color: var(--muted); margin: 24px 0 0; font-size: 16px; }
.sub span { color: var(--fg); }

h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 56px 0 6px; }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-weight: 500; font-size: 13px; color: var(--muted); text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; white-space: normal; min-width: 150px; width: 100%; }
th:last-child, td:last-child { padding-right: 0; }

input { background: transparent; color: inherit; font: inherit; letter-spacing: inherit; border: 0; border-radius: 4px; width: 6em; text-align: right; padding: 6px 8px; transition: background .15s; }
input:hover { background: var(--chip); }
input:focus { outline: none; background: var(--chip-hover); }
input::placeholder { color: #5a5a5a; }
td:first-child input { width: calc(100% + 8px); margin-left: -8px; text-align: left; }
input.fill { background: var(--chip); }

.pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }

button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 0; }
button:hover { color: var(--fg); }
button.armed { color: var(--neg); }
button:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }

form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
form input { background: var(--chip); padding: 10px 12px; text-align: left; width: auto; flex: 1 1 110px; min-width: 0; }
form input:hover { background: var(--chip-hover); }
form input:focus { background: var(--chip-hover); box-shadow: inset 0 0 0 1px #4a4a4a; }
form input.wide { flex: 3 1 220px; }
form button { background: var(--accent); color: #fff; border-radius: 4px; padding: 10px 18px; font-size: 15px; font-weight: 600; }
form button:hover { color: #fff; filter: brightness(1.1); }
@media (prefers-reduced-motion: reduce) { input { transition: none; } }

@media (max-width: 600px) {
  header { margin-bottom: 40px; }
  .hero { margin-bottom: 40px; }
  input, form input, form button { font-size: 16px; }
  .scroll { overflow: visible; }
  .stack thead { display: none; }
  .stack tr { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; row-gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .stack td { border: 0; padding: 0; min-width: 0; width: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stack td:first-child { grid-column: 1 / -1; font-weight: 600; }
  .stack td:first-child input { margin-left: -8px; }
  .stack td[data-label]::before { content: attr(data-label); color: var(--muted); font-size: 13px; white-space: nowrap; }
  .stack td.out { padding-right: 8px; }
  .stack td:last-child { grid-column: 1 / -1; justify-content: flex-end; }
  .stack td input { width: 6.5em; }
  .stack td:first-child input { width: calc(100% + 8px); }
  #xtable tr { grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; }
  #xtable td:first-child, #xtable td:last-child { grid-column: auto; }
}
</style>

<main>
  <header>
    <span class="logo">Vinstkalkyl</span>
    <span class="status" id="status">Laddar…</span>
  </header>

  <section class="hero">
    <p class="h1"><span id="tProfit">0,00 kr</span> vinst just nu.</p>
    <p class="h1 dim">Betalat <span id="tPaid">0,00 kr</span>, sålt för <span id="tSold">0,00 kr</span>.</p>
    <p class="sub">Om allt säljs: <span id="tAll">–</span></p>
  </section>

  <h2>Produkter</h2>
  <div class="scroll">
    <table class="stack">
      <thead><tr><th>Produkt</th><th>Antal</th><th>Inköp/st</th><th>Säljpris/st</th><th>Sålda</th><th>Vinst/st</th><th></th></tr></thead>
      <tbody id="pbody"></tbody>
    </table>
  </div>
  <p id="pempty" class="muted" hidden>Inga produkter än.</p>
  <form id="pForm" autocomplete="off">
    <input id="pName" class="wide" placeholder="Produkt" aria-label="Produkt" required>
    <input id="pQty" inputmode="numeric" placeholder="Antal" aria-label="Antal" required>
    <input id="pCost" inputmode="decimal" placeholder="Inköp/st" aria-label="Inköp per styck" required>
    <input id="pSell" inputmode="decimal" placeholder="Säljpris/st" aria-label="Säljpris per styck">
    <button type="submit">Lägg till</button>
  </form>

  <h2>Frakt och andra kostnader</h2>
  <div class="scroll">
    <table class="stack" id="xtable"><tbody id="xbody"></tbody></table>
  </div>
  <p id="xempty" class="muted" hidden>Inga kostnader.</p>
  <form id="xForm" autocomplete="off">
    <input id="xName" class="wide" placeholder="Vad, t.ex. Frakt" aria-label="Vad" required>
    <input id="xAmount" inputmode="decimal" placeholder="Belopp" aria-label="Belopp" required>
    <button type="submit">Lägg till</button>
  </form>
</main>

<script>
(() => {
  const kr = new Intl.NumberFormat("sv-SE", { style: "currency", currency: "SEK" });
  const fmt = (v) => kr.format(v);
  const signed = (v) => (v > 0 ? "+" : "") + fmt(v);
  const num = (s) => { const v = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(v) ? v : null; };
  const show = (v) => v == null ? "" : v.toFixed(2).replace(".", ",");
  const $ = (id) => document.getElementById(id);
  const setStatus = (t) => { $("status").textContent = t; };

  // A list stored in one db collection (or the browser, when db is unavailable).
  const P = { key: "products", ls: "vinstkalkyl.local", body: "pbody", empty: "pempty",
    fields: [["name", "text"], ["qty", "int"], ["cost", "money"], ["sell", "price", "fill"], ["sold", "int", "fill"]], out: true };
  const X = { key: "expenses", ls: "vinstkalkyl.expenses", body: "xbody", empty: "xempty",
    fields: [["name", "text"], ["amount", "money"]], out: false };
  for (const s of [P, X]) { s.map = new Map(); s.rows = new Map(); s.col = null; }

  const queues = new Map();
  function enqueue(k, fn) {
    const p = (queues.get(k) || Promise.resolve()).then(fn)
      .then(() => setStatus("Sparat"))
      .catch((e) => setStatus(e && e.code === "quota_exceeded" ? "Lagringen är full" : "Kunde inte spara ändringen"));
    queues.set(k, p);
  }
  function saveLocal(s) { try { localStorage.setItem(s.ls, JSON.stringify([...s.map.entries()])); setStatus("Sparat"); } catch { setStatus("Kunde inte spara"); } }

  function parse(type, raw) {
    if (type === "text") return raw.trim();
    const v = num(raw);
    if (type === "price") return v == null ? null : Math.max(0, v);
    if (type === "int") return v == null ? 0 : Math.max(0, Math.round(v));
    return v == null ? 0 : Math.max(0, v);
  }
  const display = (type, v) => type === "text" ? (v || "") : type === "int" ? (v ? String(v) : "") : show(v);

  // ---------- totals ----------
  function totals() {
    let paid = 0, sold = 0, all = 0, unpriced = 0;
    for (const d of P.map.values()) {
      paid += (d.cost || 0) * (d.qty || 0);
      if (d.sell == null) { unpriced++; continue; }
      sold += d.sell * Math.min(d.sold || 0, d.qty || 0);
      all += d.sell * (d.qty || 0);
    }
    for (const x of X.map.values()) paid += x.amount || 0;
    const profit = sold - paid;
    $("tPaid").textContent = fmt(paid);
    $("tSold").textContent = fmt(sold);
    const tp = $("tProfit");
    tp.textContent = signed(profit);
    tp.className = profit < 0 ? "neg" : "";
    const ta = $("tAll");
    if (P.map.size && unpriced < P.map.size) {
      ta.textContent = signed(all - paid) + (unpriced ? ` (${unpriced} utan pris)` : "");
    } else ta.textContent = "–";
  }

  function updateOut(s, id) {
    if (!s.out) return;
    const tr = s.rows.get(id), d = s.map.get(id); if (!tr || !d) return;
    const o = tr.querySelector(".out");
    if (d.sell == null) { o.textContent = "–"; o.className = "out muted"; return; }
    const u = d.sell - (d.cost || 0);
    o.textContent = fmt(u); o.className = "out " + (u > 0 ? "pos" : u < 0 ? "neg" : "");
  }

  // ---------- rows ----------
  function makeRow(s, id) {
    const tr = document.createElement("tr");
    const LABELS = { qty: "Antal", cost: "Inköp/st", sell: "Säljpris/st", sold: "Sålda" };
    for (const [key, type, cls] of s.fields) {
      const td = document.createElement("td");
      if (LABELS[key]) td.dataset.label = LABELS[key];
      const inp = document.createElement("input");
      inp.id = `${s.key}-${key}-${id}`;
      inp.dataset.f = key; inp.dataset.t = type;
      if (cls) inp.className = cls;
      if (type !== "text") inp.inputMode = type === "int" ? "numeric" : "decimal";
      if (key === "sell") inp.placeholder = "0,00";
      if (key === "sold") inp.placeholder = "0";
      inp.setAttribute("aria-label", key);
      inp.addEventListener("input", () => {
        if (type === "text") return;
        const d = s.map.get(id); if (!d) return;
        s.map.set(id, { ...d, [key]: parse(type, inp.value) });
        totals(); updateOut(s, id); s.map.set(id, d);
      });
      inp.addEventListener("change", () => commit(s, id, inp));
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") inp.blur(); });
      td.appendChild(inp); tr.appendChild(td);
    }
    if (s.out) { const td = document.createElement("td"); td.className = "out"; td.dataset.label = "Vinst/st"; tr.appendChild(td); }
    const td = document.createElement("td");
    const del = document.createElement("button");
    del.type = "button"; del.textContent = "ta bort";
    let timer;
    del.addEventListener("click", () => {
      if (del.classList.contains("armed")) {
        clearTimeout(timer); s.map.delete(id); render(s);
        if (s.col) enqueue(s.key + id, () => s.col.doc(id).delete()); else saveLocal(s);
        return;
      }
      del.classList.add("armed"); del.textContent = "säker?";
      timer = setTimeout(() => { del.classList.remove("armed"); del.textContent = "ta bort"; }, 3000);
    });
    td.appendChild(del); tr.appendChild(td);
    return tr;
  }

  function commit(s, id, inp) {
    const d = s.map.get(id); if (!d) return;
    const f = inp.dataset.f, t = inp.dataset.t;
    let v = parse(t, inp.value);
    if (t === "text" && !v) { fill(s, id); return; }
    const patch = { [f]: v };
    if (f === "sold") patch.sold = Math.min(v, d.qty || 0);
    if (f === "qty" && (d.sold || 0) > v) patch.sold = v;
    if (Object.keys(patch).every((k) => patch[k] === d[k])) { fill(s, id); return; }
    s.map.set(id, { ...d, ...patch }); fill(s, id); totals();
    if (s.col) enqueue(s.key + id, () => s.col.doc(id).update(patch)); else saveLocal(s);
  }

  function fill(s, id) {
    const tr = s.rows.get(id), d = s.map.get(id); if (!tr || !d) return;
    tr.querySelectorAll("input").forEach((inp) => {
      if (inp !== document.activeElement) inp.value = display(inp.dataset.t, d[inp.dataset.f]);
    });
    updateOut(s, id);
  }

  function render(s) {
    const body = $(s.body);
    for (const [id, tr] of s.rows) if (!s.map.has(id)) { tr.remove(); s.rows.delete(id); }
    const sorted = [...s.map.entries()].sort((a, b) => (a[1].created || 0) - (b[1].created || 0));
    for (const [id] of sorted) {
      if (!s.rows.has(id)) s.rows.set(id, makeRow(s, id));
      body.appendChild(s.rows.get(id)); fill(s, id);
    }
    $(s.empty).hidden = s.map.size > 0;
    totals();
  }

  function add(s, data) {
    let id;
    if (s.col) {
      const ref = s.col.doc(); id = ref.id;
      enqueue(s.key + id, () => ref.set(data));
    } else id = "l" + Date.now().toString(36);
    s.map.set(id, data); render(s);
    if (!s.col) saveLocal(s);
  }

  $("pForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("pName").value.trim(), qty = num($("pQty").value), cost = num($("pCost").value);
    if (!name || qty == null || cost == null) { setStatus("Fyll i produkt, antal och inköp/st"); return; }
    add(P, { name, qty: Math.max(0, Math.round(qty)), cost: Math.max(0, cost), sell: parse("price", $("pSell").value), sold: 0, created: Date.now() });
    e.target.reset(); $("pName").focus();
  });
  $("xForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("xName").value.trim(), amount = num($("xAmount").value);
    if (!name || amount == null) { setStatus("Fyll i vad och belopp"); return; }
    add(X, { name, amount: Math.max(0, amount), created: Date.now() });
    e.target.reset(); $("xName").focus();
  });

  // ---------- boot ----------
  render(P); render(X);
  const SEED = { products: [["p5du13", {"name": "Dum Bum 2 g+ 20 pcs", "qty": 4, "cost": 48.4, "sell": 150, "sold": 4, "created": 1}], ["p6a13g", {"name": "Dum Bum middle grön F3 20 pcs", "qty": 1, "cost": 61.6, "sell": 150, "sold": 1, "created": 2}], ["p6a13r", {"name": "Dum Bum middle röd F3 20 pcs", "qty": 1, "cost": 48.4, "sell": 150, "sold": 1, "created": 3}]], expenses: [["frakt-2026035701", {"name": "Frakt order 2026035701", "amount": 229.9, "created": 1}]] };
  for (const s of [P, X]) {
    let raw = null;
    try { raw = localStorage.getItem(s.ls); } catch {}
    try { s.map = new Map(raw ? JSON.parse(raw) : SEED[s.key]); } catch { s.map = new Map(SEED[s.key]); }
    if (!raw) saveLocal(s);
    render(s);
  }
  setStatus("Sparas i telefonen");
})();
</script>

</body>
</html>
